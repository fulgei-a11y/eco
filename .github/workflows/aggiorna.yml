name: Aggiorna e pubblica

on:
  schedule:
    # Ore UTC: 6:10 e 18:10 (7:10 e 19:10 in inverno, 8:10 e 20:10 in estate a Roma)
    - cron: "10 6 * * *"
    - cron: "10 18 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aggiorna-e-pubblica
  cancel-in-progress: false

jobs:
  aggiorna:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scarica i dati e calcola i testi
        env:
          # Facoltative: senza chiavi i testi sono calcolati dai dati.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/aggiorna.mjs

      - name: Controlla i file generati e i calcolatori
        run: |
          node --check data.js
          node --check archivio.js
          node scripts/verifica-calcoli.mjs

      - name: Salva i dati
        run: |
          if git diff --quiet -- data.js archivio.js && git ls-files --error-unmatch archivio.js >/dev/null 2>&1; then
            echo "Nessuna novità."
            exit 0
          fi
          git config user.name "eco"
          git config user.email "eco@users.noreply.github.com"
          # Commit senza messaggio; riallineato a main a ogni tentativo, includendo solo i dati generati
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q origin/main
            git add data.js archivio.js
            git commit -q --allow-empty-message -m "" && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

  pubblica:
    needs: aggiorna
    if: always() && needs.aggiorna.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepara il sito
        run: |
          mkdir _site
          cp index.html data.js archivio.js pillole.js bitcoin.js investire.js glossario.js calcoli.js manifest.webmanifest sw.js _site/
          cp -r icons _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
